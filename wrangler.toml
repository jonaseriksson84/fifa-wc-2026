name = "fifa-wc-2026"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"
assets = { directory = ".svelte-kit/cloudflare", binding = "ASSETS" }

[vars]
POOL_NAME = "WC 2026"
POOL_ACCENT_HEX = "#2563eb"

[triggers]
crons = ["*/5 * * * *", "0 8 * * *"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[env.friends]
name = "fifa-wc-2026-friends"

[env.friends.vars]
POOL_NAME = "WC26 Jobbiga Bets"
POOL_ACCENT_HEX = "#0369A1"
SENDER_EMAIL = "noreply@mynameisjonas.dev"
BETTER_AUTH_URL = "https://wc26.mynameisjonas.dev"

[[env.friends.routes]]
pattern = "wc26.mynameisjonas.dev"
custom_domain = true

[env.friends.triggers]
crons = ["*/5 * * * *", "0 8 * * *"]

[env.friends.observability.logs]
enabled = true
invocation_logs = true

[env.friends.observability.traces]
enabled = false

[[env.friends.d1_databases]]
binding = "DB"
database_name = "fifa-wc-2026-friends"
database_id = "ca9ac350-128e-4557-b520-eb8f813e2b05"
migrations_dir = "drizzle"

[env.work]
name = "fifa-wc-2026-work"

[env.work.vars]
POOL_NAME = "WC26 Office Picks"
POOL_ACCENT_HEX = "#0284C7"
SENDER_EMAIL = "noreply@mynameisjonas.dev"
ALLOWED_EMAIL_DOMAINS = "embark-studios.com"
BETTER_AUTH_URL = "https://wc26-embark.mynameisjonas.dev"

[[env.work.routes]]
pattern = "wc26-embark.mynameisjonas.dev"
custom_domain = true

# Refresher staggered 30m after friends to avoid rate-limit collisions on the
# shared api-football subscription (both run */5 result polling on the hour).
[env.work.triggers]
crons = ["*/5 * * * *", "30 8 * * *"]

[env.work.observability.logs]
enabled = true
invocation_logs = true

[env.work.observability.traces]
enabled = false

[[env.work.d1_databases]]
binding = "DB"
database_name = "fifa-wc-2026-work"
database_id = "28281aa7-de2e-4c8e-8dc3-a527615838b9"
migrations_dir = "drizzle"

[[d1_databases]]
binding = "DB"
database_name = "fifa-wc-2026"
database_id = "ca9ac350-128e-4557-b520-eb8f813e2b05"
migrations_dir = "drizzle"
